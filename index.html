<!DOCTYPE html>
<html lang="en" class="wf-roboto-n5-active wf-roboto-n4-active wf-roboto-n7-active wf-roboto-n1-active wf-roboto-n3-active wf-active">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <!-- Streamloader-fork branding: SVG favicon (teal disc + bar-chart-
         download mark) takes precedence in modern browsers; .ico is the
         legacy fallback. mask-icon retains streamloader teal so Safari
         pinned-tabs match. theme-color also flipped to streamloader teal
         so mobile browser chrome (PWA, Safari status bar) matches the
         brand. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="favicon.ico" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
    <link rel="mask-icon" href="favicon.svg" color="#0f766e">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0f766e">
    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#2dd4bf">
    <title>Streamloader · Music Assistant</title>
    <meta name="description" content="Streamloader - Music library manager (built on Music Assistant)">
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but musicassistant-frontend doesn't work properly without
        JavaScript enabled. Please enable it to continue.</strong
      >
    </noscript>
    <!--
      Initial paint splash. Lives inside #app so Vue's mount() will replace
      it atomically once the bundle is ready. Inline CSS + inline SVG keep
      this render-blocking-free; no extra HTTP requests, no FOUC.
    -->
    <div id="app">
      <div class="sl-splash" role="status" aria-live="polite" aria-label="Loading streamloader">
        <style>
          /* Scoped to the splash; removed entirely when Vue replaces #app. */
          .sl-splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            /* Deep navy matches the app shell gradient base. */
            background: radial-gradient(ellipse at center, #0b1626 0%, #050a13 100%);
            color: #94d6cd;
            font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            z-index: 9999;
          }
          .sl-splash__mark {
            width: 96px;
            height: 96px;
            filter: drop-shadow(0 0 18px rgba(45, 212, 191, 0.45))
                    drop-shadow(0 0 4px rgba(45, 212, 191, 0.6));
            animation: sl-splash-pulse 1.5s ease-in-out infinite;
          }
          .sl-splash__tag {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.18em;
            text-transform: lowercase;
            opacity: 0.75;
          }
          @keyframes sl-splash-pulse {
            0%, 100% { opacity: 0.7; }
            50%      { opacity: 1; }
          }
          @media (prefers-reduced-motion: reduce) {
            .sl-splash__mark { animation: none; opacity: 0.9; }
          }
        </style>
        <svg class="sl-splash__mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" fill="#0f766e"/>
          <rect x="6" y="11" width="3" height="10" rx="1.5" fill="#fff" opacity="0.9"/>
          <rect x="11" y="8" width="3" height="16" rx="1.5" fill="#fff" opacity="0.9"/>
          <rect x="16" y="10" width="3" height="12" rx="1.5" fill="#fff" opacity="0.9"/>
          <rect x="22" y="8" width="3" height="9" rx="1" fill="#fff" opacity="0.9"/>
          <path d="M21 16 L23.5 22 L26 16" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
        </svg>
        <div class="sl-splash__tag">streamloader</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
